# .github/workflows/publish-dockerhub.yml
# 把仓库根目录的插件包 (.txz) 以 OCI artifact 形式推到 Docker Hub:
#   docker.io/bcfx/unraid-docker-folders-modern:<版本>  (如 2026.10.30.4)
#   docker.io/bcfx/unraid-docker-folders-modern:latest
# 本仓库的 .txz 直接提交在 main 根目录 (非 Release 附件), 故从 checkout 取文件。
# 触发: Release (stable) 工作流成功后自动 / Actions 页手动
# 需先在仓库 Settings -> Secrets -> Actions 加 DOCKERHUB_TOKEN (Docker Hub 令牌, Read & Write)
# 本文件位于 .github/**, 在 release-main.yml 的 paths-ignore 内, 不会触发发版。
name: Publish plugin package to Docker Hub

on:
  workflow_run:
    workflows: ["Release (stable)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-dockerhub:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup oras
        uses: oras-project/setup-oras@v1

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | oras login docker.io -u "bcfx" --password-stdin

      - name: Push txz as OCI artifact
        run: |
          FILE=$(ls unraid-docker-folders-modern-*.txz | head -1)
          VERSION=$(echo "$FILE" | sed -e 's/^unraid-docker-folders-modern-//' -e 's/\.txz$//')
          echo "Pushing $FILE as version $VERSION"
          oras push \
            --annotation "org.opencontainers.image.title=${FILE}" \
            "docker.io/bcfx/unraid-docker-folders-modern:${VERSION}" \
            "${FILE}:application/octet-stream"
          oras tag "docker.io/bcfx/unraid-docker-folders-modern:${VERSION}" latest
          echo "已推送: docker.io/bcfx/unraid-docker-folders-modern:${VERSION} 和 :latest"
